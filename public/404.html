<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found — Shaimaa Alrifay</title>
    <!-- Its presence also matters: on Cloudflare Pages a root 404.html
         switches off the "serve index.html for every unknown path"
         fallback, so a missing .js returns a real 404 instead of HTML
         (which browsers report as a text/html MIME-type error). -->
    <style>
      html,body{height:100%;margin:0}
      body{display:grid;place-items:center;background:#000B15;color:#F5F5F2;
        font-family:"Inter Tight",system-ui,sans-serif;text-align:center}
      a{color:inherit}
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist. <a href="/">Back to the portfolio</a></p>
    </main>
  </body>
</html>
