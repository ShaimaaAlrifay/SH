# Nginx config for the production build (contents of dist/).
# Merge into the site's server { } block; adjust server_name and root.
#
# If the site lives in a subfolder (e.g. https://example.com/portfolio/),
# put dist/ there and use `location /portfolio/ { ... }` with the same rules —
# the build uses relative asset URLs, so no rebuild is needed for that.

server {
    listen 80;
    server_name example.com;

    root /var/www/portfolio;   # = uploaded contents of dist/
    index index.html;

    # Make sure .js is served as JavaScript (mime.types maps it to
    # application/javascript; this include is required).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        image/webp webp;
    }

    # Built, content-hashed files: exact file or real 404 — never index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page site with no client-side routes: serve the file, the
    # directory index, or 404. Do NOT use `try_files $uri /index.html;`
    # here — it turns every missing .js into an HTML 200 response.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
